<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/pg-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PG Manager: rooms, rent, meals and repairs for PG owners, in one place.">
  <meta name="theme-color" content="#2F6B4F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PG Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PG Manager</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F5; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: linear-gradient(160deg, #2F6B4F, #1F4E3A); color: #fff; transition: opacity .35s;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #splash b { font-size: 26px; letter-spacing: .3px; }
    #splash span { font-size: 15px; opacity: .85; }
    #splash i { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; position: relative; }
    #splash i::after { content: ""; position: absolute; left: -40%; top: 0; width: 40%; height: 100%; background: #F2C14E;
      border-radius: 4px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { to { left: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <img src="icons/Icon-192.png" alt="">
    <b>PG Manager</b>
    <span>Rooms · Rent · Meals · Repairs</span>
    <i></i>
  </div>
  <script>
    // Hide the loading screen once the app has drawn itself.
    (function () {
      var hide = function () {
        var s = document.getElementById('splash');
        if (!s) return;
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 400);
      };
      new MutationObserver(function (m, o) {
        if (document.querySelector('flutter-view, flt-glass-pane')) { o.disconnect(); setTimeout(hide, 300); }
      }).observe(document.body, { childList: true, subtree: true });
      setTimeout(hide, 15000);   // never block the app
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
