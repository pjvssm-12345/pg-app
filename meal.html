<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="origin">
<title>PGNivas has moved</title>
<script>
// PGNivas moved to pgnivas.in on 8 Nov 2026. This page only forwards to the new address.
(function () {
  var dest = 'https://pgnivas.in/meal/' + location.search;
  var hash = location.hash;
  try {
    var p = new URLSearchParams(location.search).get('p') || '';
    if (p) {
      var keys = ['pgmeal_device', 'pgmeal_lang', 'pgmeal_' + p, 'pgmeal_req_' + p], keep = {}, n = 0;
      for (var i = 0; i < keys.length; i++) { var v = localStorage.getItem(keys[i]); if (v != null) { keep[keys[i]] = v; n++; } }
      if (n && localStorage.getItem('pgmeal_' + p) != null) hash = '#mv=' + encodeURIComponent(JSON.stringify(keep));
    }
  } catch (e) {}
  location.replace(dest + hash);
})();
</script>
<style>body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:32px 20px;text-align:center;color:#1D2B24}a{color:#2F6B4F}</style>
</head>
<body>
<p>PGNivas has moved to <a id="go" href="https://pgnivas.in/meal/">pgnivas.in/meal</a>.</p>
<script>document.getElementById('go').href = 'https://pgnivas.in/meal/' + location.search + location.hash;</script>
</body>
</html>
