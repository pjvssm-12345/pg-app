  .langs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .langs button { min-height: 36px; padding: 0 12px; border-radius: 999px; background: #fff; color: var(--ink);
    border: 1px solid var(--line); font-size: 14px; }
  .langs button[aria-pressed="true"] { background: var(--leaf); color: #fff; border-color: var(--leaf); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .day-title { font-weight: 700; font-size: 17px; }
  .pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: #E3F1EA; color: var(--leaf-dark); }
  .pill.wait { background: var(--turmeric-bg); color: var(--turmeric); }
  .pill.lock { background: #EDF1EF; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-top: 1px solid #EDF1EF; }
  .row:first-of-type { border-top: 0; }
  .meal { font-size: 16px; }
  .meal small { display: block; color: var(--muted); font-size: 13px; }
  /* big, easy switch */
  .sw { position: relative; width: 58px; height: 34px; flex: none; }
  .sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; background: #C9D3CE; border-radius: 999px; transition: background .15s; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; background: #fff;
    border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .sw input:checked + span { background: var(--leaf); }
  .sw input:checked + span::after { transform: translateX(24px); }
  .sw input:disabled + span { opacity: .45; }
  .sw input:focus-visible + span { outline: 3px solid #8FC1A8; outline-offset: 2px; }
  button { font: inherit; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; cursor: pointer; }
  .btn { width: 100%; background: var(--leaf); color: #fff; font-weight: 600; font-size: 16px; padding: 10px 16px; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; color: var(--leaf); border: 1.5px solid var(--leaf); }
  .btn.done { background: #E3F1EA; color: var(--leaf-dark); }
  .all { margin-top: 10px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  select, input.t { width: 100%; font: inherit; font-size: 17px; min-height: 48px; padding: 0 12px; border: 1px solid #B8C4BE;

  input.t { letter-spacing: 6px; font-size: 22px; text-align: center; }

  .note { color: var(--muted); font-size: 14px; }

  .tip.owner { background: #E3F1EA; border: 1px solid #BFDCCB; }

  .rep { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }

      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_source: 'meal', p_message: String(m || '?').slice(0, 500),
        p_detail: String(d || '').slice(0, 2000), p_page: location.pathname }) }).catch(() => {});
  } catch (e) {}
}
window.addEventListener('error', e => logErr(e.message, (e.filename || '') + ':' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => logErr(e.reason && e.reason.message || e.reason, e.reason && e.reason.stack));

async function rpc(fn, body) {
  let r;
  try {
  r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  } catch (e) { throw new Error(trMsg('Could not reach the server. Check your internet and try again.')); }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error(trMsg((data && data.message) || 'Could not reach the server. Check your internet and try again.'));
  if (data && data.ok === false && data.message) data.message = trMsg(data.message);
  return data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dayName(iso, isToday) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const loc = LOCALE[lang] || 'en-IN';
  const dm = dt.toLocaleDateString(loc, { day: 'numeric', month: 'short' });
  return isToday ? `${t('today')}, ${dm}` : dt.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

}

// A different "don't waste food" note every day (same note for everyone on the same day).
function todayTip() {
  const now = new Date();
  const dayNo = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const slot = now.getHours() < 12 ? 0 : now.getHours() < 17 ? 1 : 2;  // morning / afternoon / evening
  const tips = t('tips');
  const [ico, text] = tips[(dayNo * 3 + slot) % tips.length];
  return `<div class="tip daily" role="note"><div class="ico" aria-hidden="true">${ico}</div>
    <div><b>${t('todaysNote')}</b><p>${esc(text)}</p></div></div>`;
}
function ownerTip(note) {
  if (!note) return '';
  return `<div class="tip owner" role="note"><div class="ico" aria-hidden="true">📢</div>
    <div><b>${t('ownerNote')}</b><p>${esc(note)}</p></div></div>`;

// Make the photo small (longest side 1024 px, JPG) so it uploads fast on mobile data.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const tryQ = q => c.toBlob(b => {
        if (!b) return reject(new Error('photo'));
        if (b.size > 280000 && q > 0.4) return tryQ(q - 0.15);
        resolve(b);
      }, 'image/jpeg', q);
      tryQ(0.75);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('photo')); };
    img.src = url;
  });
}

// Upload into this phone's own private folder; returns the saved path.
async function uploadPhoto(blob) {
  const folder = await rpc('vote_photo_folder', { p_token: token() });
  const name = `${folder}/${Date.now()}${Math.random().toString(36).slice(2, 8)}.jpg`;
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/issue-photos/${name}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' },
    body: blob,
  });
  if (!r.ok) throw new Error('upload ' + r.status);
  return name;
}

    </div>
    <p class="center"><button class="btn ghost" id="back">${t('pass_back')}</button></p>`;
  const tick = () => { const el = document.getElementById('clk'); if (el) el.textContent = new Date().toLocaleTimeString(LOCALE[lang] || 'en-IN'); };
  clearInterval(passTimer); tick(); passTimer = setInterval(tick, 1000);
  wireLangBar(showPass);
  document.getElementById('back').onclick = () => {
    clearInterval(passTimer);
    try { history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(link)); } catch (e) {}
    goMeals = true; showMeals();
  };
}
let goMeals = false;   // after "Back to my meals", logins go to the meal list

// Printable counter poster: meal.html?p=LINK&k=COUNTER&poster=1 (made from the owner app).
function showCounterPoster() {
  const url = location.origin + location.pathname + '?p=' + encodeURIComponent(link) + '&k=' + encodeURIComponent(counter);
  app.innerHTML = `<div class="poster"><h1>🍽️ Scan before taking food</h1>
    <p class="sub" style="font-size:18px">Open your phone camera and point it here. Show the green screen to the cook.</p>
    <div id="qr"></div>
    <p class="note">Guests only. The screen shows your name, room and the time.</p>
    <p class="noprint"><button class="btn" onclick="print()">🖨️ Print this poster</button></p></div>`;
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  sc.integrity = 'sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=='; sc.crossOrigin = 'anonymous';  // refuse the script if cdnjs ever changes it
  sc.onload = () => { const q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); };
  sc.onerror = () => { document.getElementById('qr').innerHTML = `<p class="msg">QR could not load. Link: ${esc(url)}</p>`; };
  document.head.appendChild(sc);
}

async function start() {
  if (link && counter && posterMode) return showCounterPoster();
  if (link && counter) return token() ? showPass() : showLogin(t('pass_notguest'));
  if (link && invite) {
    try { history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(link)); } catch (e) {}
    try {
      const res = await rpc('vote_claim', { p_link: link, p_code: invite, p_device: deviceId });
      if (res.ok) {
        setToken(res.token); state = null;
        await showMeals(); toast(t('phoneVerified')); return;
      }
      if (!token()) return showLogin(res.message);
      // Already logged in on this phone (e.g. tapped the old link again): carry on; say why only if not verified.
      await showMeals();
      if (!status.verified) toast(res.message);
      return;
    } catch (e) { if (!token()) return showLogin(e.message); }
  }
  showMeals();
}
start();
</script>
